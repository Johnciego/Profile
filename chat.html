<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Chat</title>
    <link rel="stylesheet" href="css/chat.css">
</head> 
<body>
    <header>
        <h1>Mom</h1>
    </header>
    <main>
        <div class="textleft">  
                Come down to the kitchen, i've made pancakes for breakfast
        </div>
        <div class="textright">  
                Alright, I'll be down in a minute!
        </div>
         <div class="textleft">  
                Hurry up before your pancakes get cold! or i'll eat them myself.
        </div>
        <div class="textright">  
                Don't you dare eat my pancakes!
        </div>
    </main>
    <footer class="send">
        <input class="sendinput" type="text" id="message" placeholder="メーセージを入力...">
        <button class="sendbutton" type="button">送信</button>
    </footer>
</body>
</html>
